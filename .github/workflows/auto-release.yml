name: Build & Release Plugin

on:
  push:
    branches:
      - main

permissions:
  contents: write

env:
  JAVA_VERSION: '17'
  JAVA_DISTRIBUTION: 'temurin'
  PLUGIN_ID: 'com.pekaboo.opensource.open-shell-toolbar'

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      # ── Checkout ──────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── Setup JDK ────────────────────────────────────────────
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      # ── Setup Gradle ─────────────────────────────────────────
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # ── Configure Git ────────────────────────────────────────
      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      # ── Version Bump ─────────────────────────────────────────
      # Strategy: commit message prefix → bump level
      #   feat!: / fix!: / BREAKING CHANGE → major
      #   feat:                            → minor (reset patch=0)
      #   fix: / anything else             → patch
      - name: Bump version
        id: version
        run: |
          CURRENT=$(grep '^version = ' build.gradle.kts | sed 's/version = "\(.*\)"/\1/')
          echo "Current version: $CURRENT"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"

          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            COMMIT_RANGE="HEAD"
          else
            COMMIT_RANGE="${PREV_TAG}..HEAD"
          fi

          # Detect highest bump level from conventional commits
          HAS_BREAKING=$(git log $COMMIT_RANGE --oneline 2>/dev/null \
            | grep -Ei "^[a-f0-9]+ (feat!|fix!|[a-z]+!:|.*BREAKING CHANGE)" | wc -l | tr -d ' ')
          HAS_FEAT=$(git log $COMMIT_RANGE --oneline --grep="^feat" 2>/dev/null | wc -l | tr -d ' ')

          if [ "$HAS_BREAKING" -gt 0 ]; then
            NEW_VERSION="$((MAJOR + 1)).0.0"
            BUMP_KIND="major"
          elif [ "$HAS_FEAT" -gt 0 ]; then
            NEW_VERSION="${MAJOR}.$((MINOR + 1)).0"
            BUMP_KIND="minor"
          else
            NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
            BUMP_KIND="patch"
          fi

          echo "Bump: $BUMP_KIND  →  $CURRENT → $NEW_VERSION"
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "old_version=$CURRENT"     >> "$GITHUB_OUTPUT"
          echo "prev_tag=$PREV_TAG"       >> "$GITHUB_OUTPUT"

          # Update build.gradle.kts
          sed -i "s/^version = \".*\"/version = \"${NEW_VERSION}\"/" build.gradle.kts

          # Update plugin.xml <version>
          PLUGIN_XML="src/main/resources/META-INF/plugin.xml"
          sed -i "s|<version>.*</version>|<version>${NEW_VERSION}</version>|" "$PLUGIN_XML"

          # Update pom.xml version
          if [ -f pom.xml ]; then
            python3 -c "import re; p = 'pom.xml'; t = open(p).read(); t = re.sub(r'(<artifactId>open-shell-toolbar-plugin</artifactId>\s*<version>).*?(</version>)', r'\1' + '${NEW_VERSION}' + r'\2', t, flags=re.DOTALL); open(p, 'w').write(t)"
          fi
      # ── Generate Changelog ───────────────────────────────────
      - name: Generate changelog
        id: changelog
        run: |
          NEW_VERSION="${{ steps.version.outputs.new_version }}"
          PREV_TAG="${{ steps.version.outputs.prev_tag }}"
          REPO="${{ github.repository }}"

          if [ -z "$PREV_TAG" ]; then
            COMMIT_RANGE="HEAD"
            COMPARE_BASE=$(git rev-list --max-parents=0 HEAD | cut -c1-7)
          else
            COMMIT_RANGE="${PREV_TAG}..HEAD"
            COMPARE_BASE="$PREV_TAG"
          fi

          # Use a random delimiter so changelog content can never truncate the heredoc
          DELIM="CHANGELOG_$(openssl rand -hex 8)"

          {
            echo "CHANGELOG<<${DELIM}"
            echo "## What's Changed"
            echo ""

            TOTAL=$(git log $COMMIT_RANGE --oneline 2>/dev/null | wc -l | tr -d ' ')
            echo "**${TOTAL} commits** since previous release."
            echo ""

            # Breaking changes
            BREAKING=$(git log $COMMIT_RANGE --oneline 2>/dev/null \
              | grep -Ei "^[a-f0-9]+ (feat!|fix!|[a-z]+!:|.*BREAKING CHANGE)" || true)
            if [ -n "$BREAKING" ]; then
              echo "### 💥 Breaking Changes"
              echo "$BREAKING" | while read -r line; do
                hash=$(echo "$line" | cut -d' ' -f1)
                msg=$(echo "$line" | sed "s/^$hash //")
                echo "- $msg ($hash)"
              done
              echo ""
            fi

            # Features
            FEATS=$(git log $COMMIT_RANGE --oneline --grep="^feat" 2>/dev/null \
              | grep -v "^[a-f0-9]\+ feat!" || true)
            if [ -n "$FEATS" ]; then
              echo "### 🚀 New Features"
              echo "$FEATS" | while read -r line; do
                hash=$(echo "$line" | cut -d' ' -f1)
                msg=$(echo "$line" | sed "s/^$hash //;s/^feat[^:]*: //")
                echo "- $msg ($hash)"
              done
              echo ""
            fi

            # Bug fixes
            FIXES=$(git log $COMMIT_RANGE --oneline --grep="^fix" 2>/dev/null \
              | grep -v "^[a-f0-9]\+ fix!" || true)
            if [ -n "$FIXES" ]; then
              echo "### 🐛 Bug Fixes"
              echo "$FIXES" | while read -r line; do
                hash=$(echo "$line" | cut -d' ' -f1)
                msg=$(echo "$line" | sed "s/^$hash //;s/^fix[^:]*: //")
                echo "- $msg ($hash)"
              done
              echo ""
            fi

            # Other changes (exclude noisy types)
            OTHER=$(git log $COMMIT_RANGE --oneline 2>/dev/null \
              | grep -Ev "^[a-f0-9]+ (feat|fix|chore|ci|style|test|build|docs)[!:(]" || true)
            if [ -n "$OTHER" ]; then
              echo "### 📦 Other Changes"
              echo "$OTHER" | while read -r line; do
                hash=$(echo "$line" | cut -d' ' -f1)
                msg=$(echo "$line" | sed "s/^$hash //")
                echo "- $msg ($hash)"
              done
              echo ""
            fi

            echo "---"
            echo ""
            echo "**Full Changelog**: https://github.com/${REPO}/compare/${COMPARE_BASE}...v${NEW_VERSION}"
            echo "${DELIM}"
          } >> "$GITHUB_OUTPUT"

          # Also emit a plain-text version for changeNotes (HTML, no markdown links)
          DELIM2="CHANGENOTES_$(openssl rand -hex 8)"
          {
            echo "CHANGENOTES<<${DELIM2}"
            if [ -n "$BREAKING" ]; then
              echo "<b>Breaking Changes</b><br/><ul>"
              echo "$BREAKING" | while read -r line; do
                msg=$(echo "$line" | sed "s/^[a-f0-9]* //")
                echo "<li>${msg}</li>"
              done
              echo "</ul>"
            fi
            if [ -n "$FEATS" ]; then
              echo "<b>New Features</b><br/><ul>"
              echo "$FEATS" | while read -r line; do
                msg=$(echo "$line" | sed "s/^[a-f0-9]* //;s/^feat[^:]*: //")
                echo "<li>${msg}</li>"
              done
              echo "</ul>"
            fi
            if [ -n "$FIXES" ]; then
              echo "<b>Bug Fixes</b><br/><ul>"
              echo "$FIXES" | while read -r line; do
                msg=$(echo "$line" | sed "s/^[a-f0-9]* //;s/^fix[^:]*: //")
                echo "<li>${msg}</li>"
              done
              echo "</ul>"
            fi
            echo "${DELIM2}"
          } >> "$GITHUB_OUTPUT"

      # ── Update changeNotes in build.gradle.kts ───────────────
      - name: Patch changeNotes in build.gradle.kts
        run: |
          # Python reads all values from the env: block below — no shell interpolation needed.

          # Replace the entire changeNotes block with current release notes
          python3 - <<'PYEOF'
          import re, os, sys

          version  = os.environ.get("NEW_VERSION", "")
          notes    = os.environ.get("NOTES", "").strip()

          path = "build.gradle.kts"
          text = open(path).read()

          new_block = f'changeNotes = """\n            <b>{version}</b><br/>\n            {notes}\n        """.trimIndent()'
          text = re.sub(
              r'changeNotes\s*=\s*""".*?"""\s*\.trimIndent\(\)',
              new_block,
              text,
              flags=re.DOTALL,
          )
          open(path, "w").write(text)
          print("changeNotes patched.")
          PYEOF
        env:
          NEW_VERSION: ${{ steps.version.outputs.new_version }}
          NOTES: ${{ steps.changelog.outputs.CHANGENOTES }}

      # ── Update <change-notes> in plugin.xml ──────────────────
      - name: Patch change-notes in plugin.xml
        run: |
          # Python reads all values from the env: block below — no shell interpolation needed.

          python3 - <<'PYEOF'
          import re, os

          version = os.environ.get("NEW_VERSION", "")
          notes   = os.environ.get("NOTES", "").strip()
          path    = os.environ.get("PLUGIN_XML", "src/main/resources/META-INF/plugin.xml")

          text = open(path).read()
          new_block = (
              f"<change-notes><![CDATA[\n"
              f"        <b>{version}</b><br/>\n"
              f"        {notes}\n"
              f"    ]]></change-notes>"
          )
          text = re.sub(
              r'<change-notes>.*?</change-notes>',
              new_block,
              text,
              flags=re.DOTALL,
          )
          open(path, "w").write(text)
          print("change-notes patched.")
          PYEOF
        env:
          NEW_VERSION: ${{ steps.version.outputs.new_version }}
          NOTES: ${{ steps.changelog.outputs.CHANGENOTES }}
          PLUGIN_XML: src/main/resources/META-INF/plugin.xml

      # ── Build Plugin ─────────────────────────────────────────
      - name: Build plugin
        run: |
          ./gradlew buildPlugin --no-daemon

          DIST_FILE=$(ls build/distributions/open-shell-toolbar-plugin-*.zip 2>/dev/null | head -1)
          if [ -z "$DIST_FILE" ]; then
            echo "::error::Plugin distribution not found"
            exit 1
          fi
          echo "Distribution: $DIST_FILE"
          ls -lh build/distributions/

      # ── Verify Plugin ────────────────────────────────────────
      - name: Verify plugin
        run: |
          ./gradlew verifyPlugin --no-daemon

      # ── Update CHANGELOG.md ──────────────────────────────────
      - name: Update CHANGELOG.md
        run: |
          VERSION="${{ steps.version.outputs.new_version }}"
          DATE=$(date +%Y-%m-%d)

          {
            echo "# Changelog"
            echo ""
            echo "## [${VERSION}] - ${DATE}"
            echo ""
            echo "${{ steps.changelog.outputs.CHANGELOG }}"
            echo ""
            # Append previous entries (strip the old "# Changelog" header line)
            if [ -f CHANGELOG.md ]; then
              tail -n +2 CHANGELOG.md
            fi
          } > CHANGELOG_NEW.md
          mv CHANGELOG_NEW.md CHANGELOG.md

      # ── Single Commit + Tag ───────────────────────────────────
      # All file mutations land in one commit to keep history clean.
      - name: Commit, tag and push
        run: |
          VERSION="${{ steps.version.outputs.new_version }}"
          git add build.gradle.kts \
                  src/main/resources/META-INF/plugin.xml \
                  CHANGELOG.md
          if [ -f pom.xml ]; then
            git add pom.xml
          fi
          git commit -m "chore: release v${VERSION} [skip ci]"
          git tag "v${VERSION}"
          git push
          git push origin "v${VERSION}"

      # ── Create GitHub Release ────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.new_version }}
          name: "Open Shell Toolbar v${{ steps.version.outputs.new_version }}"
          body: |
            ${{ steps.changelog.outputs.CHANGELOG }}

            ---

            ### 📦 Installation
            1. Download the `.zip` file below
            2. In IntelliJ IDEA: **Settings → Plugins → ⚙️ → Install Plugin from Disk...**
            3. Select the downloaded zip file
            4. Restart IDE

            ### 📋 Plugin Info
            | Property | Value |
            |----------|-------|
            | Version | `${{ steps.version.outputs.new_version }}` |
            | Min IDE Build | `233` |
            | Plugin ID | `${{ env.PLUGIN_ID }}` |
          files: |
            build/distributions/open-shell-toolbar-plugin-*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Publish to JetBrains Marketplace ─────────────────────
      - name: Publish to JetBrains Marketplace
        if: env.JETBRAINS_TOKEN != ''
        env:
          JETBRAINS_TOKEN: ${{ secrets.JETBRAINS_TOKEN }}
          JETBRAINS_CHANNEL: ${{ vars.JETBRAINS_CHANNEL || 'stable' }}
        run: |
          ./gradlew publishPlugin --no-daemon
