name: Build & Release Plugin

on:
  push:
    branches:
      - main

permissions:
  contents: write

env:
  JAVA_VERSION: '17'
  JAVA_DISTRIBUTION: 'temurin'
  PLUGIN_ID: 'com.pekaboo.opensource.open-shell-toolbar'

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      # ── Checkout ──────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── Setup JDK ────────────────────────────────────────────
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      # ── Setup Gradle ─────────────────────────────────────────
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # ── Configure Git ────────────────────────────────────────
      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      # ── Version Bump ─────────────────────────────────────────
      - name: Bump minor version
        id: version
        run: |
          # Read current version from build.gradle.kts
          CURRENT=$(grep '^version = ' build.gradle.kts | sed "s/version = \"\(.*\)\"/\1/")
          echo "Current version: $CURRENT"

          # Parse semver
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"

          # Increment minor version, reset patch to 0
          NEW_MINOR=$((MINOR + 1))
          NEW_VERSION="${MAJOR}.${NEW_MINOR}.0"

          echo "New version: $NEW_VERSION"
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "old_version=$CURRENT" >> "$GITHUB_OUTPUT"

          # Update build.gradle.kts
          sed -i "s/^version = \".*\"/version = \"${NEW_VERSION}\"/" build.gradle.kts

          # Update plugin.xml version and since-build
          PLUGIN_XML="src/main/resources/META-INF/plugin.xml"
          sed -i "s|<version>.*</version>|<version>${NEW_VERSION}</version>|" "$PLUGIN_XML"

      # ── Generate Changelog ───────────────────────────────────
      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            COMMIT_RANGE="HEAD"
          else
            COMMIT_RANGE="${PREV_TAG}..HEAD"
          fi
          echo "Commit range: $COMMIT_RANGE"

          {
            echo "CHANGELOG<<EOF"
            echo "## What's Changed"
            echo ""

            TOTAL_COMMITS=$(git log $COMMIT_RANGE --oneline 2>/dev/null | wc -l)
            echo "**${TOTAL_COMMITS} commits** since previous release."
            echo ""

            # Features
            FEATS=$(git log $COMMIT_RANGE --oneline --grep="^feat" 2>/dev/null || true)
            if [ -n "$FEATS" ]; then
              echo "### 🚀 New Features"
              echo "$FEATS" | while read -r line; do
                hash=$(echo "$line" | cut -d' ' -f1)
                msg=$(echo "$line" | sed "s/^$hash //;s/^feat[^:]*: //")
                echo "- $msg (${hash})"
              done
              echo ""
            fi

            # Bug fixes
            FIXES=$(git log $COMMIT_RANGE --oneline --grep="^fix" 2>/dev/null || true)
            if [ -n "$FIXES" ]; then
              echo "### 🐛 Bug Fixes"
              echo "$FIXES" | while read -r line; do
                hash=$(echo "$line" | cut -d' ' -f1)
                msg=$(echo "$line" | sed "s/^$hash //;s/^fix[^:]*: //")
                echo "- $msg (${hash})"
              done
              echo ""
            fi

            # Other changes
            OTHER=$(git log $COMMIT_RANGE --oneline --invert-grep --grep="^feat\|^fix\|^chore\|^ci\|^style\|^test" 2>/dev/null || true)
            if [ -n "$OTHER" ]; then
              echo "### 📦 Other Changes"
              echo "$OTHER" | while read -r line; do
                hash=$(echo "$line" | cut -d' ' -f1)
                msg=$(echo "$line" | sed "s/^$hash //")
                echo "- $msg (${hash})"
              done
              echo ""
            fi

            echo "---"
            echo ""
            REPO="${{ github.repository }}"
            echo "**Full Changelog**: https://github.com/${REPO}/compare/${PREV_TAG:-$(git rev-list --max-parents=0 HEAD | head -c7)}...v${{ steps.version.outputs.new_version }}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # ── Build Plugin ─────────────────────────────────────────
      - name: Build plugin
        run: |
          ./gradlew buildPlugin --no-daemon

          # Verify distribution
          DIST_FILE="build/distributions/open-shell-toolbar-plugin-*.zip"
          if ls $DIST_FILE 1>/dev/null 2>&1; then
            echo "Distribution created successfully"
            ls -lh build/distributions/
          else
            echo "::error::Plugin distribution not found"
            exit 1
          fi

      # ── Verify Plugin ────────────────────────────────────────
      - name: Verify plugin
        run: |
          ./gradlew verifyPlugin --no-daemon

      # ── Commit Version Bump ──────────────────────────────────
      - name: Commit version bump
        run: |
          git add build.gradle.kts src/main/resources/META-INF/plugin.xml
          git commit -m "chore: release v${{ steps.version.outputs.new_version }} [skip ci]"
          git push

      # ── Create Tag ───────────────────────────────────────────
      - name: Create git tag
        run: |
          git tag "v${{ steps.version.outputs.new_version }}"
          git push origin "v${{ steps.version.outputs.new_version }}"

      # ── Update CHANGELOG.md ──────────────────────────────────
      - name: Update CHANGELOG.md
        run: |
          VERSION="${{ steps.version.outputs.new_version }}"
          DATE=$(date +%Y-%m-%d)
          CHANGELOG_BODY="${{ steps.changelog.outputs.CHANGELOG }}"

          {
            echo "# Changelog"
            echo ""
            echo "## [${VERSION}] - ${DATE}"
            echo ""
            echo "${CHANGELOG_BODY}"
            echo ""
            if [ -f CHANGELOG.md ]; then
              sed '1,/^$/d' CHANGELOG.md | tail -n +2
            fi
          } > CHANGELOG_NEW.md
          mv CHANGELOG_NEW.md CHANGELOG.md

          git add CHANGELOG.md
          git commit -m "docs: update CHANGELOG for v${VERSION} [skip ci]"
          git push

      # ── Create GitHub Release ────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.new_version }}
          name: "Open Shell Toolbar v${{ steps.version.outputs.new_version }}"
          body: |
            ${{ steps.changelog.outputs.CHANGELOG }}

            ---

            ### 📦 Installation
            1. Download the `.zip` file below
            2. In IntelliJ IDEA: **Settings → Plugins → ⚙️ → Install Plugin from Disk...**
            3. Select the downloaded zip file
            4. Restart IDE

            ### 📋 Plugin Info
            | Property | Value |
            |----------|-------|
            | Version | `${{ steps.version.outputs.new_version }}` |
            | Min IDE Build | `233` |
            | Plugin ID | `${{ env.PLUGIN_ID }}` |
          files: |
            build/distributions/open-shell-toolbar-plugin-*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Publish to JetBrains Marketplace ─────────────────────
      - name: Publish to JetBrains Marketplace
        if: env.JETBRAINS_TOKEN != ''
        env:
          JETBRAINS_TOKEN: ${{ secrets.JETBRAINS_TOKEN }}
          JETBRAINS_CHANNEL: ${{ vars.JETBRAINS_CHANNEL || 'stable' }}
        run: |
          ./gradlew publishPlugin --no-daemon
